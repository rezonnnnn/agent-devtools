name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: npm ci
      - run: node scripts/build-native.mjs
      - run: npm test
        env:
          # Hosted Linux runners cannot use Chrome's sandbox.
          AGENT_DEVTOOLS_TEST_FLAGS: ${{ runner.os == 'Linux' && '--chromeArg=--no-sandbox' || '' }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: native-clients
          path: native/agent-devtools-*
